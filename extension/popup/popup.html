<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakerPeek</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="logo">MakerPeek</h1>
        <span class="status-dot" id="status-dot" title="Not on a Shopify store"></span>
      </header>

      <main>
        <p class="tagline">Honest seller research for POD shops.</p>

        <div class="usage-box">
          <p class="usage-label">Free lookups today</p>
          <p class="usage-count"><span id="used">—</span> / 5</p>
        </div>

        <button class="cta-btn" id="sign-in-btn">
          Sign in to unlock unlimited lookups
        </button>
      </main>

      <footer>
        <a href="https://makerpeek.com/privacy" target="_blank" rel="noopener">Privacy</a>
        &middot;
        <a href="https://makerpeek.com" target="_blank" rel="noopener">makerpeek.com</a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
